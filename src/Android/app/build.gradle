plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sanctifylive.display'
    compileSdk 34

    defaultConfig {
        applicationId "com.sanctifylive.display"
        minSdk 26          // Android 8.0 — covers every tablet in active use
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug   // replace with real keystore for production
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // No third-party deps on purpose — this app must be dead-simple and auditable.
    // Everything is plain Android SDK.
}
